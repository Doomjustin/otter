name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: clang-tidy and clang-format
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build-tidy
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux
      CMAKE_BUILD_TYPE: Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 开启完整 commit 历史，供 git-clang-format 对比 diff

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Sync Python environment
        run: uv sync --locked

      - name: Install toolchain and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            clang-format-18 \
            clang-tidy-18 \
            libtool \
            ninja-build
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "${VCPKG_ROOT}" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          fi
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Setup CMake 4.0+
        run: |
          uv tool install "cmake>=4.0.3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure CMake for compile commands
        run: |
          cmake -S . -B "${BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

      # 增量游标格式化检查：仅针对 PR 改动到的代码行
      - name: Run incremental clang-format check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git-clang-format --diff origin/${{ github.base_ref }}

      - name: Run clang-tidy review
        if: github.event_name == 'pull_request'
        uses: ZedThree/clang-tidy-review@v0.20.1
        with:
          build_dir: build-tidy
          config_file: .clang-tidy
          split_workflow: false
          exclude: 'build*/**'
          include: 'src/**/*.[ch]pp'
          annotations: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Sync Python environment
        run: uv sync --locked

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            libtool \
            ninja-build

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "${VCPKG_ROOT}" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          fi
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Setup CMake 4.0+
        run: |
          uv tool install "cmake>=4.0.3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: |
          cmake -S . -B "build-${CMAKE_BUILD_TYPE}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build "build-${CMAKE_BUILD_TYPE}" --config "${CMAKE_BUILD_TYPE}"

      - name: Run tests
        run: ctest --test-dir "build-${CMAKE_BUILD_TYPE}" --output-on-failure --build-config "${CMAKE_BUILD_TYPE}"